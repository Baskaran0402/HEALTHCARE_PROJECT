services:
  # Backend FastAPI Service
  - type: web
    name: aruviai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: healthcare-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: SECRET_KEY
        generateValue: true
      - key: MASTER_CRYPTO_KEY
        value: mXp-tW7-9u_X_Xz-p1Z-w-X_p_X_X-p_X_X-u_X_X_X= # Placeholder or user provided
      - key: FRONTEND_URL
        value: https://aruviai-frontend.onrender.com # Update this after frontend deployment

  # Frontend Vite/React Service
  - type: web
    name: aruviai-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://aruviai-backend.onrender.com # Update this after backend deployment

databases:
  - name: healthcare-db
    plan: free
